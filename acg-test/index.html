<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>二次元本命属性测试</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-touch-callout: none; -webkit-user-select: none; }
        body { font-family: sans-serif; background: #f9f0ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; width: 100%; max-width: 400px; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h2 { color: #722ed1; margin-bottom: 15px; font-size: 20px; }
        p { color: #666; margin-bottom: 20px; line-height: 1.6; font-size: 16px; }
        button { background: #722ed1; color: #fff; border: none; padding: 12px 20px; border-radius: 30px; width: 100%; margin-bottom: 10px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
        .result { display: none; font-size: 18px; font-weight: bold; color: #722ed1; margin-top: 20px; line-height: 1.6; }
    </style>
</head>
<body>
<div class="card">
    <div id="quiz">
        <h2>🎮 二次元本命属性测试</h2>
        <p id="q-text">Q1. 你最想拥有哪种超能力？</p>
        <button data-val="10">A. 瞬间移动，去任何想去的地方 ✨</button>
        <button data-val="10">B. 读心术，知道别人在想什么 🧠</button>
    </div>
    <div id="result" class="result"></div>
</div>
<script>
    let score = 0;
    const questions = [
        { q: "Q1. 你最想拥有哪种超能力？", opts: ["A. 瞬间移动，去任何想去的地方 ✨", "B. 读心术，知道别人在想什么 🧠"] },
        { q: "Q2. 在动漫里，你通常最关注哪类角色？", opts: ["A. 战力爆表、拯救世界的英雄 ⚔️", "B. 智商超群、运筹帷幄的军师 📖"] },
        { q: "Q3. 如果穿越到异世界，你想当？", opts: ["A. 独自冒险的独行侠 🏹", "B. 建立公会的领导者 🏰"] },
        { q: "Q4. 你最不能忍受动漫里的什么情节？", opts: ["A. 强行降智，逻辑崩坏 🤯", "B. 烂尾，挖坑不填 🕳️"] },
        { q: "Q5. 周末宅家，你最想干嘛？", opts: ["A. 补番打游戏，快乐似神仙 🎮", "B. 逛漫展买谷子，为爱发电 💖"] }
    ];
    let currentQ = 0;

    document.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', function() {
            score += parseInt(this.getAttribute('data-val'));
            currentQ++;
            if (currentQ < questions.length) {
                document.getElementById('q-text').innerText = questions[currentQ].q;
                const buttons = document.querySelectorAll('button');
                buttons[0].innerText = questions[currentQ].opts[0];
                buttons[1].innerText = questions[currentQ].opts[1];
            } else {
                showResult();
            }
        });
    });

    function showResult() {
        document.getElementById('quiz').style.display = 'none';
        const resDiv = document.getElementById('result');
        resDiv.style.display = 'block';
        let msg = score >= 40 ? "⚔️ 你的本命属性是：热血战斗派！你向往自由和力量，骨子里是个充满正义感的冒险家。" : "📖 你的本命属性是：智斗剧情派！你注重逻辑和深度，是个喜欢思考的二次元哲学家。";
        resDiv.innerText = `测试结果：\n${msg}`;
    }
</script>
</body>
</html>
